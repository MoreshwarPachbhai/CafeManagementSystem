<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Your original external CSS is linked here -->
    <link rel="stylesheet" href="/css/reset.css">
</head>
<body>
    <div class="flex-container">
        <!-- Assuming this is for background/visuals -->
        <div class="left-panel">
             <!-- Placeholder content for the left panel, maybe a logo or image -->
        </div>
        
        <!-- This panel contains the actual form -->
        <div class="right-panel">
            <div class="login-form">
                <!-- Display Error or Success Messages -->
                <!-- Note: The styling for these alerts depends on your login2.css -->
                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>
                <div th:if="${message}" class="alert alert-success">
                    <p th:text="${message}"></p>
                </div>

                <!-- The form action correctly targets the @PostMapping in the controller -->
                <form th:action="@{/reset-password}" method="post">
                    <h2 class="reset-passwordH">Reset Password</h2>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter Username" required>
                    </div>

                    <div class="input-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Enter New Password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
                    </div>

                    <button type="submit">Reset Password</button>

                    <p class="back-login">
                        <a th:href="@{/login}">Back to Login</a>
                    </p>
                </form>
            </div>
        </div>
        <img src="/CLUB SANDWICH 1.png" alt="Sandwich" class="split_image">
    </div>

    <!-- Add this near the end of <body> in your base template or header fragment -->
<audio id="orderSound" preload="auto">
  <source src="/audio/new-order.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>


</body>
</html>
